<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 강화 RPG 아이콘 — 대장간 테마: 그을음 바탕 · 쇳물로 달궈진 검 · 놋쇠 손잡이 · 튀는 불티 -->
  <defs>
    <linearGradient id="soot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a15"/>
      <stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <radialGradient id="heat" cx="256" cy="600" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6e1a" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ff6e1a" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff6e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeHi" x1="0" y1="54" x2="0" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset=".45" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="bladeLo" x1="0" y1="54" x2="0" y2="326" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset=".45" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#c9440c"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset=".5" stop-color="#d4a24c"/>
      <stop offset="1" stop-color="#7a4f17"/>
    </linearGradient>
    <radialGradient id="pommel" cx=".38" cy=".34" r=".75">
      <stop offset="0" stop-color="#ffefc0"/>
      <stop offset=".45" stop-color="#d4a24c"/>
      <stop offset="1" stop-color="#6e4614"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="sparkGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- 바탕: 그을음 + 아래에서 올라오는 화로 열기 -->
    <rect width="512" height="512" fill="url(#soot)"/>
    <rect width="512" height="512" fill="url(#heat)"/>

    <!-- 전경(불씨·검·불티). 마스커블 아이콘은 이 묶음만 안전영역 크기로 줄인다 -->
    <g id="art">

    <!-- 아래에서 떠오르는 불씨 (게임 배경 #embers 와 같은 느낌) -->
    <g fill="#ffb347">
      <circle cx="400" cy="430" r="7" opacity=".85"/>
      <circle cx="440" cy="372" r="4.5" opacity=".6"/>
      <circle cx="356" cy="470" r="4" opacity=".5"/>
      <circle cx="462" cy="452" r="3.5" opacity=".45"/>
    </g>

    <g transform="rotate(45 256 256) translate(256 256) scale(1.13) translate(-256 -258)">
      <!-- 달궈진 칼날 뒤로 번지는 열기 -->
      <path d="M226 326 V124 L256 54 L286 124 V326 Z" fill="#ff7a1a" opacity=".75" filter="url(#glow)"/>

      <!-- 칼날: 가운데 능선을 기준으로 밝은 면 / 어두운 면 -->
      <path d="M226 326 V124 L256 54 V326 Z" fill="url(#bladeHi)"/>
      <path d="M256 54 L286 124 V326 H256 Z" fill="url(#bladeLo)"/>
      <path d="M256 70 V318" stroke="#fff3cf" stroke-width="3" opacity=".55"/>
      <path d="M226 326 V124 L256 54 L286 124 V326 Z" fill="none" stroke="#170f0a" stroke-width="9" stroke-linejoin="round"/>

      <!-- 손잡이 -->
      <rect x="241" y="352" width="30" height="78" rx="4" fill="#5b3a22" stroke="#170f0a" stroke-width="8"/>
      <path d="M243 372 L269 362 M243 392 L269 382 M243 412 L269 402" stroke="#2c1a0c" stroke-width="5" stroke-linecap="round"/>

      <!-- 코등이(가드): 놋쇠 + 가운데 쇳물 보석 -->
      <path d="M160 340 L180 322 H332 L352 340 L332 358 H180 Z" fill="url(#brass)" stroke="#170f0a" stroke-width="9" stroke-linejoin="round"/>
      <path d="M182 330 H330" stroke="#fff1c4" stroke-width="3" stroke-linecap="round" opacity=".6"/>
      <path d="M256 324 L272 340 L256 356 L240 340 Z" fill="#ff7a1a" stroke="#170f0a" stroke-width="6" stroke-linejoin="round"/>
      <path d="M256 330 L264 338 L256 340 L248 338 Z" fill="#ffd27a"/>

      <!-- 폼멜 -->
      <circle cx="256" cy="448" r="21" fill="url(#pommel)" stroke="#170f0a" stroke-width="8"/>
    </g>

    <!-- 칼날에서 튀는 불티 -->
    <g filter="url(#sparkGlow)" fill="#ff9a3c" opacity=".9">
      <circle cx="138" cy="146" r="16"/>
      <circle cx="90" cy="214" r="9"/>
      <circle cx="200" cy="84" r="8"/>
    </g>
    <g fill="#fff1c4">
      <path d="M138 118 Q142 142 166 146 Q142 150 138 174 Q134 150 110 146 Q134 142 138 118 Z"/>
      <path d="M90 200 Q92 212 104 214 Q92 216 90 228 Q88 216 76 214 Q88 212 90 200 Z"/>
      <circle cx="200" cy="84" r="5.5"/>
      <circle cx="160" cy="200" r="4"/>
      <circle cx="84" cy="156" r="3.5"/>
    </g>
    </g>
  </g>
</svg>
